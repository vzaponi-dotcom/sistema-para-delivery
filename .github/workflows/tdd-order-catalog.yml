name: TDD order catalog

on:
  push:
    branches:
      - master

jobs:
  order-catalog-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run new-order tests
        run: node --test src/pages/NewOrder.test.js
