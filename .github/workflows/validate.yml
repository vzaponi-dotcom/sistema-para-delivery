name: Validate application

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/spec-b-settings-policies
      - feature/comandas-table-list-polish
  workflow_dispatch:

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused Comandas polish tests
        run: node --test src/comandasTableListPolish.test.js

      - name: Comandas regression tests
        run: node --test src/comandaResponsiveDensity.test.js src/comandasAppWiring.test.js src/comandasTransferNavigation.test.js src/components/ComandaDetail.test.js

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Validate Spec B D1 clean install and upgrade
        run: node scripts/infra/spec-b-d1-gate.mjs
