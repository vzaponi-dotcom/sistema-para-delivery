name: Spec B payment DnD TDD

on:
  push:
    branches:
      - feature/spec-b-settings-policies
    paths:
      - src/pages/PaymentSettings.jsx
      - src/pages/PaymentSettings.test.js
      - src/payment-settings.css
      - src/assets/pix-symbol.svg
      - package.json
      - package-lock.json
      - .github/workflows/spec-b-payment-dnd-tdd.yml

permissions:
  contents: write

jobs:
  focused:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/spec-b-settings-policies

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and refresh lockfile
        run: npm install --ignore-scripts

      - name: Verify dnd-kit dependency
        run: npm ls @dnd-kit/react

      - name: Focused payment settings tests
        run: node --test --test-concurrency=1 src/pages/PaymentSettings.test.js

      - name: Proportional settings regression
        run: >-
          node --test --test-concurrency=1
          src/pages/PaymentSettings.test.js
          src/components/SettingsPrimitives.test.js
          src/settingsNavigation.test.js
          src/settingsDraftNavigation.test.js
          src/specBSettingsIntegration.test.js
          src/settingsResponsive.test.js
          src/pages/OperationSettings.test.js

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync dnd-kit lockfile"
          git push origin HEAD:feature/spec-b-settings-policies
