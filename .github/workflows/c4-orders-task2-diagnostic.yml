name: C4 Orders Task 2 Diagnostic

on:
  push:
    branches:
      - automation/c4-orders-executor
    paths:
      - .github/workflows/c4-orders-task2-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose-task2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact C4 Task 2 HEAD
        uses: actions/checkout@v4
        with:
          ref: 1223c79e53abd5159821267c80ab067accb2b5bb
          fetch-depth: 0

      - name: Assert branch and master safety
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "1223c79e53abd5159821267c80ab067accb2b5bb"
          git fetch origin master feature/spec-c4-orders automation/c4-orders-executor
          test "$(git rev-parse origin/feature/spec-c4-orders)" = "1223c79e53abd5159821267c80ab067accb2b5bb"
          test "$(git rev-parse origin/master)" = "737beeac2150aabeb39024af823f2f60fee25108"

      - name: Install dependencies
        run: npm ci

      - name: Isolate failing test files
        id: isolated
        shell: bash
        run: |
          set -u
          mkdir -p /tmp/c4-task2
          : > /tmp/c4-task2/failures.txt
          overall=0
          while IFS= read -r -d '' test_file; do
            set +e
            output=$(node --test "$test_file" 2>&1)
            status=$?
            set -e
            if [ "$status" -ne 0 ]; then
              overall=1
              {
                echo "===== FAIL: $test_file ====="
                printf '%s\n' "$output"
                echo "STATUS=$status"
              } >> /tmp/c4-task2/failures.txt
            fi
          done < <(find . -path './node_modules' -prune -o -name '*.test.js' -print0 | sort -z)
          echo "isolated_status=$overall" >> "$GITHUB_OUTPUT"
          if [ -s /tmp/c4-task2/failures.txt ]; then cat /tmp/c4-task2/failures.txt; else echo 'ALL_TEST_FILES_PASS'; fi

      - name: Run full suite diagnostic
        id: full
        shell: bash
        run: |
          set -u
          set +e
          npm test > /tmp/c4-task2/full-suite.txt 2>&1
          status=$?
          set -e
          echo "full_status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 /tmp/c4-task2/full-suite.txt

      - name: Run architecture and diff diagnostics
        id: broad
        shell: bash
        run: |
          set -u
          set +e
          npm run test:architecture > /tmp/c4-task2/architecture.txt 2>&1
          architecture_status=$?
          git diff --check > /tmp/c4-task2/diff-check.txt 2>&1
          diff_status=$?
          set -e
          echo "architecture_status=$architecture_status" >> "$GITHUB_OUTPUT"
          echo "diff_status=$diff_status" >> "$GITHUB_OUTPUT"

      - name: Persist diagnostic evidence on auxiliary branch
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "feature_head=1223c79e53abd5159821267c80ab067accb2b5bb"
            echo "isolated_status=${{ steps.isolated.outputs.isolated_status }}"
            echo "full_status=${{ steps.full.outputs.full_status }}"
            echo "architecture_status=${{ steps.broad.outputs.architecture_status }}"
            echo "diff_status=${{ steps.broad.outputs.diff_status }}"
            echo
            echo '===== FAILING TEST FILES ====='
            if [ -s /tmp/c4-task2/failures.txt ]; then cat /tmp/c4-task2/failures.txt; else echo 'ALL_TEST_FILES_PASS'; fi
            echo
            echo '===== FULL SUITE TAIL ====='
            tail -n 100 /tmp/c4-task2/full-suite.txt
          } > /tmp/c4-task2/task2-diagnostic.txt

          rm -rf /tmp/c4-task2-aux
          git worktree add -B automation/c4-orders-executor /tmp/c4-task2-aux origin/automation/c4-orders-executor
          mkdir -p /tmp/c4-task2-aux/diagnostics
          cp /tmp/c4-task2/task2-diagnostic.txt /tmp/c4-task2-aux/diagnostics/task2-diagnostic.txt
          cd /tmp/c4-task2-aux
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/task2-diagnostic.txt
          git commit -m 'chore: record c4 task2 isolated diagnostics' || true
          git push origin HEAD:automation/c4-orders-executor

      - name: Enforce diagnostic gates
        shell: bash
        run: |
          test "${{ steps.isolated.outputs.isolated_status }}" = "0"
          test "${{ steps.full.outputs.full_status }}" = "0"
          test "${{ steps.broad.outputs.architecture_status }}" = "0"
          test "${{ steps.broad.outputs.diff_status }}" = "0"
