name: Desktop payment select polish

on:
  push:
    branches:
      - feature/split-payments

permissions:
  contents: read

jobs:
  validate:
    name: validate desktop payment select polish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: >-
          node --test
          src/systemSelect.test.js
          src/app/workflows/payments/PaymentCompositionEditor.test.js
          src/app/workflows/payments/paymentComposition.test.js
      - name: Validate frontend architecture
        run: npm run test:architecture
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
