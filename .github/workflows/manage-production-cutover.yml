name: Manage production cutover

on:
  workflow_dispatch:
    inputs:
      cutover_action:
        description: Safe pre-cutover administrative action
        required: true
        default: inspect_inventory
        type: choice
        options:
          - inspect_inventory
          - prepare_business_manager
          - check_ready
      ownership_confirmed:
        description: Confirm manager e-mail ownership before preparing the business manager
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-cutover-admin
  cancel-in-progress: false

jobs:
  manage:
    name: Manage production cutover
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      AMOR_PIN: ${{ secrets.AMOR_PIN }}
      CUTOVER_MANAGER_NAME: ${{ secrets.CUTOVER_MANAGER_NAME }}
      CUTOVER_MANAGER_EMAIL: ${{ secrets.CUTOVER_MANAGER_EMAIL }}
      AUTH_PUBLIC_ORIGIN: ${{ vars.AUTH_PUBLIC_ORIGIN }}
      AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
      AUTH_EMAIL_DAILY_LIMIT: ${{ vars.AUTH_EMAIL_DAILY_LIMIT || '80' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://app.mesiva.com.br' }}
      CUTOVER_ACTION: ${{ inputs.cutover_action }}
      OWNERSHIP_CONFIRMED: ${{ inputs.ownership_confirmed }}
      BUSINESS_ID: amor-e-sabor

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Require latest master commit
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "This master commit has been superseded; production cutover administration is blocked."
            exit 1
          fi

      - name: Check production cutover configuration
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production Cloudflare credentials are not configured."
            exit 1
          fi
          if [ "$AUTH_PUBLIC_ORIGIN" != "https://app.mesiva.com.br" ]; then
            echo "AUTH_PUBLIC_ORIGIN must be the official production app origin."
            exit 1
          fi
          if [ "$CUTOVER_ACTION" = "prepare_business_manager" ]; then
            if [ "$OWNERSHIP_CONFIRMED" != "true" ]; then
              echo "Manager ownership confirmation is required."
              exit 1
            fi
            if [ -z "$RESEND_API_KEY" ] || [ -z "$AUTH_EMAIL_FROM" ] || [ -z "$CUTOVER_MANAGER_NAME" ] || [ -z "$CUTOVER_MANAGER_EMAIL" ]; then
              echo "Private manager/e-mail configuration is incomplete."
              exit 1
            fi
          fi
          if [ "$CUTOVER_ACTION" = "check_ready" ] && [ -z "$CUTOVER_MANAGER_EMAIL" ]; then
            echo "Private manager e-mail configuration is required for readiness."
            exit 1
          fi

      - name: Record production D1 restore point
        if: inputs.cutover_action == 'prepare_business_manager'
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx --yes wrangler@4.128.0 d1 time-travel info amor-e-sabor-delivery --json)"
          bookmark="$(RAW="$raw" node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.RAW || 'null')
          const findBookmark = current => {
            if (Array.isArray(current)) {
              for (const item of current) {
                const found = findBookmark(item)
                if (found) return found
              }
              return ''
            }
            if (!current || typeof current !== 'object') return ''
            if (typeof current.bookmark === 'string' && current.bookmark.trim()) return current.bookmark.trim()
            for (const item of Object.values(current)) {
              const found = findBookmark(item)
              if (found) return found
            }
            return ''
          }
          const bookmark = findBookmark(value)
          if (!bookmark || !/^[A-Za-z0-9_-]{16,}$/.test(bookmark)) throw new Error('Unable to resolve a current D1 Time Travel bookmark.')
          process.stdout.write(bookmark)
          NODE
          )"
          printf 'Production D1 restore bookmark before manager preparation: `%s`\n' "$bookmark" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production prepare phase
        env:
          PRODUCTION_AUTH_PHASE: prepare
        run: node scripts/infra/production-auth-smoke.mjs

      - name: Run safe cutover administration
        run: node scripts/infra/manage-production-cutover-actions.mjs
