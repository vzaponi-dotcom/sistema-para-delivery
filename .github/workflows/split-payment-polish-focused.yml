name: Split payment polish focused CI

on:
  push:
    branches:
      - feature/split-payments

permissions:
  contents: read

jobs:
  focused:
    name: focused split payment polish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused payment polish tests
        run: >-
          node --test
          src/app/workflows/payments/paymentComposition.test.js
          src/app/workflows/payments/PaymentCompositionEditor.test.js
          src/app/workflows/payments/table-tab/TableTabPaymentDialog.test.js
          src/app/workflows/payments/order/useOrderPaymentWorkflow.test.js
          src/operationalPayment.test.js
          src/navigationContinuity.test.js
          src/systemSelect.test.js
          src/newOrderSystemSelect.test.js

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
