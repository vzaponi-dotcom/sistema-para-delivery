name: TDD finance task 7

on:
  push:
    branches:
      - finance-task-6-ui-corrections

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run finance view tests
        run: node --test src/pages/Finance.test.js src/utils/finance.test.js
