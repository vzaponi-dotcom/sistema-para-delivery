name: TDD finance task 6

on:
  push:
    branches:
      - finance-task-6-ui-corrections

jobs:
  red-green:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Worker dry-run
        run: npx --yes wrangler@4.128.0 deploy --dry-run
