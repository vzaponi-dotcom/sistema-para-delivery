name: Deploy staging

on:
  push:
    branches:
      - feature/mesiva-visual-theme
      - feature/operation-identity-settings
      - feature/kitchen-alert-sound-profiles
      - feature/kitchen-tv-adaptive-card-layout
      - feature/issue-34-reporting-center
      - feature/release-reporting-center
      - feature/kitchen-tv-best-fit-layout
      - feature/kitchen-tv-control-center
      - feature/issue-82-multiday-reservations
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PIN: ${{ secrets.STAGING_PIN }}
      STAGING_R2_BUCKET: mesiva-business-assets-staging
      STAGING_READY_ATTEMPTS: 6
      STAGING_URL: https://staging.mesiva.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Check staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Ensure staging R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if npx --yes wrangler@4.128.0 r2 bucket info "$STAGING_R2_BUCKET" --json --env staging >/tmp/staging-r2.json 2>/tmp/staging-r2.err; then
            echo "Staging R2 bucket already exists: $STAGING_R2_BUCKET"
          else
            echo "Creating staging R2 bucket: $STAGING_R2_BUCKET"
            npx --yes wrangler@4.128.0 r2 bucket create "$STAGING_R2_BUCKET" --env staging
            npx --yes wrangler@4.128.0 r2 bucket info "$STAGING_R2_BUCKET" --json --env staging >/tmp/staging-r2.json
          fi
          cat /tmp/staging-r2.json
          rm -f /tmp/staging-r2.json /tmp/staging-r2.err

      - name: Show pending staging migrations
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery-staging --remote --env staging

      - name: Apply staging migrations
        run: npm run d1:migrate:staging

      - name: Configure staging PIN only before account cutover
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$STAGING_PIN" ]; then
            echo "No staging PIN supplied; account-only smoke needs none, legacy/enrollment smoke will require it."
            exit 0
          fi
          VERIFIER="$(PIN="$STAGING_PIN" node scripts/generate-pin-hash.mjs)"
          echo "::add-mask::$VERIFIER"
          VERIFIER="$VERIFIER" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { stagingPinSql } from './scripts/infra/staging-auth-smoke.mjs'
          fs.writeFileSync('/tmp/staging-pin.sql', stagingPinSql(process.env.VERIFIER), { mode: 0o600 })
          NODE
          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery-staging --remote --env staging --yes --file /tmp/staging-pin.sql
          rm -f /tmp/staging-pin.sql
          unset VERIFIER

      - name: Deploy staging
        run: npm run deploy:staging

      - name: Verify staging login
        run: node scripts/infra/staging-auth-smoke.mjs

      - name: Verify staging deep links
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.STAGING_URL
          const attempts = Number(process.env.STAGING_READY_ATTEMPTS)
          const paths = [
            '/pedidos',
            '/pedidos/historico',
            '/pedidos/controle-da-tv',
            '/comandas',
            '/financeiro/a-receber',
            '/financeiro/movimentacoes',
            '/relatorios',
            '/configuracoes/impressao',
            '/configuracoes/identidade',
            '/minha-conta',
            '/configuracoes/equipe',
            '/configuracoes/atividades',
            '/ativar-conta',
            '/recuperar-senha',
            '/redefinir-senha',
            '/cozinha-tv',
            '/aceitar-convite',
            '/empresas',
            '/mesiva',
            '/mesiva/empresas',
          ]

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

          for (const path of paths) {
            let ready = false
            let lastError = 'unknown propagation error'

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const pageUrl = new URL(path, baseUrl)
                pageUrl.searchParams.set('__staging_verify', `${Date.now()}-${attempt}`)
                const response = await fetch(pageUrl, {
                  redirect: 'manual',
                  cache: 'no-store',
                  headers: { 'cache-control': 'no-cache' },
                })
                if (response.status !== 200) throw new Error(`HTTP ${response.status}`)

                const contentType = response.headers.get('content-type') || ''
                if (!contentType.includes('text/html')) {
                  throw new Error(`unexpected content-type: ${contentType}`)
                }

                const body = await response.text()
                if (!body.includes('id="root"')) throw new Error('SPA shell missing')

                const assetRefs = [...body.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map((match) => match[1])
                if (!assetRefs.length) throw new Error('build assets missing')

                for (const ref of assetRefs) {
                  const assetUrl = new URL(ref, pageUrl)
                  assetUrl.searchParams.set('__staging_verify', `${Date.now()}-${attempt}`)
                  const expectedType = assetUrl.pathname.endsWith('.css') ? 'text/css' : 'javascript'
                  const assetResponse = await fetch(assetUrl, {
                    cache: 'no-store',
                    headers: { 'cache-control': 'no-cache' },
                  })
                  const assetType = assetResponse.headers.get('content-type') || ''
                  if (!assetResponse.ok || !assetType.includes(expectedType)) {
                    throw new Error(`asset ${assetUrl.pathname}: HTTP ${assetResponse.status}, content-type ${assetType}`)
                  }
                }

                ready = true
                break
              } catch (error) {
                lastError = error.message
                console.log(`Deep link ${path} propagation attempt ${attempt}/${attempts}: ${lastError}`)
                if (attempt < attempts) await sleep(3000)
              }
            }

            if (!ready) {
              console.error(`Deep link ${path} did not become ready in the bounded propagation window: ${lastError}`)
              process.exit(1)
            }

            console.log(`Deep link ${path}: HTTP 200 / SPA shell + assets OK`)
          }
          NODE

      - name: Summarize staging URL
        run: |
          echo "Staging URL: $STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
