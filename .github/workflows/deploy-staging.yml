name: Deploy staging

on:
  push:
    branches:
      - feature/print-queue-bulk-discard
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy staging Worker
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PIN: ${{ secrets.STAGING_PIN }}
      STAGING_READY_ATTEMPTS: 6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Check staging credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$STAGING_PIN"

      - name: Show pending staging migrations
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery-staging --remote --env staging

      - name: Apply staging migrations
        run: npm run d1:migrate:staging

      - name: Configure staging PIN
        shell: bash
        run: |
          VERIFIER="$(PIN="$STAGING_PIN" node scripts/generate-pin-hash.mjs)"
          echo "::add-mask::$VERIFIER"
          VERIFIER="$VERIFIER" node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const verifier = process.env.VERIFIER
          if (!verifier) throw new Error('Staging PIN verifier was not generated.')
          const escaped = verifier.replaceAll("'", "''")
          fs.writeFileSync('/tmp/staging-pin.sql', `INSERT INTO auth_credentials (business_id, pin_hash, created_at, updated_at)\nVALUES ('amor-e-sabor', '${escaped}', datetime('now'), datetime('now'))\nON CONFLICT(business_id) DO UPDATE SET pin_hash = excluded.pin_hash, updated_at = datetime('now');\n`, { mode: 0o600 })
          NODE
          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery-staging --remote --env staging --yes --file /tmp/staging-pin.sql
          rm -f /tmp/staging-pin.sql
          unset VERIFIER

      - name: Deploy staging
        run: npm run deploy:staging

      - name: Verify staging login
        env:
          STAGING_URL: https://sistema-para-delivery-staging.vzaponi.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.STAGING_URL
          const attempts = Number(process.env.STAGING_READY_ATTEMPTS)
          let ready = false

          for (let attempt = 1; attempt <= attempts; attempt += 1) {
            try {
              const response = await fetch(`${baseUrl}/api/auth/session`)
              if (response.ok) {
                console.log(`Staging ready on attempt ${attempt}/${attempts}`)
                ready = true
                break
              }
              console.log(`Staging readiness attempt ${attempt}/${attempts}: HTTP ${response.status}`)
            } catch (error) {
              console.log(`Staging readiness attempt ${attempt}/${attempts}: ${error.message}`)
            }
            if (attempt < attempts) await new Promise((resolve) => setTimeout(resolve, 5000))
          }

          if (!ready) {
            console.error('Staging did not become ready within the bounded propagation window.')
            process.exit(1)
          }

          const response = await fetch(`${baseUrl}/api/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: baseUrl },
            body: JSON.stringify({ pin: process.env.STAGING_PIN }),
          })
          if (!response.ok) {
            console.error(`Staging login failed with HTTP ${response.status}`)
            process.exit(1)
          }
          console.log(`Staging login HTTP ${response.status}`)
          NODE

      - name: Verify staging deep links
        env:
          STAGING_URL: https://sistema-para-delivery-staging.vzaponi.workers.dev
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.STAGING_URL
          const paths = [
            '/pedidos',
            '/pedidos/historico',
            '/comandas',
            '/financeiro/a-receber',
            '/financeiro/movimentacoes',
            '/configuracoes/impressao',
            '/cozinha-tv',
          ]

          for (const path of paths) {
            const pageUrl = `${baseUrl}${path}`
            const response = await fetch(pageUrl, { redirect: 'manual' })
            if (response.status !== 200) {
              console.error(`Deep link ${path} failed with HTTP ${response.status}`)
              process.exit(1)
            }
            const contentType = response.headers.get('content-type') || ''
            if (!contentType.includes('text/html')) {
              console.error(`Deep link ${path} returned unexpected content-type: ${contentType}`)
              process.exit(1)
            }
            const body = await response.text()
            if (!body.includes('id="root"')) {
              console.error(`Deep link ${path} did not return the SPA shell`)
              process.exit(1)
            }

            const assetRefs = [...body.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map((match) => match[1])
            if (!assetRefs.length) {
              console.error(`Deep link ${path} did not expose build assets`)
              process.exit(1)
            }

            for (const ref of assetRefs) {
              const assetUrl = new URL(ref, pageUrl)
              const expectedType = assetUrl.pathname.endsWith('.css') ? 'text/css' : 'javascript'
              let assetReady = false

              for (let attempt = 1; attempt <= Number(process.env.STAGING_READY_ATTEMPTS); attempt += 1) {
                const assetResponse = await fetch(assetUrl)
                const assetType = assetResponse.headers.get('content-type') || ''
                if (assetResponse.ok && assetType.includes(expectedType)) {
                  assetReady = true
                  break
                }
                console.log(`Deep link ${path} asset ${assetUrl.pathname} propagation attempt ${attempt}/${process.env.STAGING_READY_ATTEMPTS}: HTTP ${assetResponse.status}, content-type ${assetType}`)
                if (attempt < Number(process.env.STAGING_READY_ATTEMPTS)) {
                  await new Promise((resolve) => setTimeout(resolve, 3000))
                }
              }

              if (!assetReady) {
                console.error(`Deep link ${path} asset ${assetUrl.pathname} did not become ready in the bounded propagation window`)
                process.exit(1)
              }
            }

            console.log(`Deep link ${path}: HTTP 200 / SPA shell + assets OK`)
          }
          NODE

      - name: Summarize staging URL
        run: |
          echo 'Staging URL: https://sistema-para-delivery-staging.vzaponi.workers.dev' >> "$GITHUB_STEP_SUMMARY"
