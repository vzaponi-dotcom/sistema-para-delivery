name: Task 6 order identity wiring

on:
  push:
    branches:
      - feature/catalog-local-orders-round
    paths:
      - scripts/wire-order-identity-repository.mjs
      - .github/workflows/task6-wire-order-identity.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/catalog-local-orders-round
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wire-order-identity-repository.mjs
      - name: Require repository change
        run: |
          if git diff --quiet -- worker/repositories.js; then
            echo "Expected worker/repositories.js to change"
            exit 1
          fi
      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/repositories.js
          git commit -m "feat: persist order customer identity"
          git push origin HEAD:feature/catalog-local-orders-round
