name: C1 session integration codemod

on:
  push:
    branches:
      - feature/spec-c1-runtime
    paths:
      - .github/workflows/c1-session-codemod.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/spec-c1-runtime
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply session runtime integration
        run: node scripts/c1-integrate-session-runtime.mjs
      - name: Verify focused Task 6 regressions
        run: |
          node --test \
            src/app/runtime/session/useSessionRuntime.test.js \
            src/AppNewOrderGuard.test.js \
            src/AppReceivablesPromise.test.js \
            src/actionCapabilities.test.js \
            src/app/effectiveBusinessConfig.test.js
          npm run lint
          git diff --check
      - name: Commit integrated App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          git diff --cached --quiet && { echo "Expected App.jsx integration diff was empty"; exit 1; }
          git commit -m "refactor: extract session runtime"
          git push origin HEAD:feature/spec-c1-runtime
