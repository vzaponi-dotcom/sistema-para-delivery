name: Patch table tabs task 2

on:
  push:
    branches:
      - feature/table-tabs-round
    paths:
      - .github/workflows/patch-table-tabs-task2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/table-tabs-round
      - name: Apply exact table tab checkout patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('worker/repositories.js')
          source = path.read_text()

          replacements = [
            (
              "export const mapTableTabRow = (row) => ({\n  id: row.id,\n  tableIdentifier: row.table_identifier,\n  status: row.status,\n  openedAt: row.opened_at,\n  closedAt: row.closed_at ?? null,\n})\n\nexport const mapOrderItemRow",
              "export const mapTableTabRow = (row) => ({\n  id: row.id,\n  tableIdentifier: row.table_identifier,\n  status: row.status,\n  openedAt: row.opened_at,\n  closedAt: row.closed_at ?? null,\n})\n\nexport const normalizeTableIdentifier = (value) => String(value ?? '').trim().toUpperCase()\n\nexport const getOrCreateOpenTableTab = async (db, businessId, rawIdentifier, now = new Date()) => {\n  const tableIdentifier = normalizeTableIdentifier(rawIdentifier)\n  const selectOpen = () => db.prepare(`SELECT id, table_identifier, status, opened_at, closed_at FROM table_tabs WHERE business_id = ? AND table_identifier = ? AND status = 'open' LIMIT 1`).bind(businessId, tableIdentifier).first()\n\n  let row = await selectOpen()\n  if (row) return mapTableTabRow(row)\n\n  const id = crypto.randomUUID()\n  const timestamp = now.toISOString()\n  await db.prepare(`INSERT OR IGNORE INTO table_tabs (id, business_id, table_identifier, status, opened_at, closed_at, created_at, updated_at) VALUES (?, ?, ?, 'open', ?, NULL, ?, ?)`).bind(id, businessId, tableIdentifier, timestamp, timestamp, timestamp).run()\n\n  row = await selectOpen()\n  if (!row) throw repositoryError(500, 'TABLE_TAB_CREATE_FAILED', 'Não foi possível abrir a comanda da mesa.')\n  return mapTableTabRow(row)\n}\n\nexport const mapOrderItemRow",
            ),
            (
              "  const itemsResult = await db.prepare(`${itemSelect} WHERE business_id = ? ORDER BY created_at ASC`).bind(businessId).all()\n  const movementsResult = await db.prepare(`SELECT id, type, category, description, value_cents, source, order_id, payment_id, movement_date, created_at FROM movements WHERE business_id = ? ORDER BY created_at DESC`).bind(businessId).all()",
              "  const itemsResult = await db.prepare(`${itemSelect} WHERE business_id = ? ORDER BY created_at ASC`).bind(businessId).all()\n  const tableTabsResult = await db.prepare(`SELECT id, table_identifier, status, opened_at, closed_at FROM table_tabs WHERE business_id = ? ORDER BY opened_at DESC`).bind(businessId).all()\n  const movementsResult = await db.prepare(`SELECT id, type, category, description, value_cents, source, order_id, payment_id, movement_date, created_at FROM movements WHERE business_id = ? ORDER BY created_at DESC`).bind(businessId).all()",
            ),
            (
              "    orders: rows(ordersResult).map((orderRow) => mapOrderRow(orderRow, itemsByOrder.get(orderRow.id) ?? [])),\n    movements: rows(movementsResult).map(mapMovementRow),",
              "    orders: rows(ordersResult).map((orderRow) => mapOrderRow(orderRow, itemsByOrder.get(orderRow.id) ?? [])),\n    tableTabs: rows(tableTabsResult).map(mapTableTabRow),\n    movements: rows(movementsResult).map(mapMovementRow),",
            ),
            (
              "  let clientId = null\n  let clientSnapshot = ''",
              "  let clientId = null\n  let clientSnapshot = ''\n  let tableTabId = null",
            ),
            (
              "  } else if (customerIdentity.type === 'table') {\n    clientSnapshot = `Mesa ${customerIdentity.value}`",
              "  } else if (customerIdentity.type === 'table') {\n    const tableTab = await getOrCreateOpenTableTab(db, businessId, customerIdentity.value, now)\n    clientSnapshot = `Mesa ${tableTab.tableIdentifier}`\n    tableTabId = tableTab.id",
            ),
            (
              "INSERT INTO orders (id, business_id, client_id, client_name_snapshot, customer_identity_type, type, order_date, status, subtotal_cents, delivery_fee_cents, adjustment_type, adjustment_mode, adjustment_value, adjustment_amount_cents, adjustment_reason, total_cents, created_at, finished_at, idempotency_key) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)",
              "INSERT INTO orders (id, business_id, client_id, client_name_snapshot, customer_identity_type, table_tab_id, type, order_date, status, subtotal_cents, delivery_fee_cents, adjustment_type, adjustment_mode, adjustment_value, adjustment_amount_cents, adjustment_reason, total_cents, created_at, finished_at, idempotency_key) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)"
            ),
            (
              "    customerIdentity.type,\n    input.type,",
              "    customerIdentity.type,\n    tableTabId,\n    input.type,",
            ),
          ]

          for old, new in replacements:
            count = source.count(old)
            if count != 1:
              raise SystemExit(f'Expected exactly one match, found {count}: {old[:100]}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/repositories.js
          git commit -m "feat: reuse open table tabs during checkout"
          git push origin HEAD:feature/table-tabs-round
