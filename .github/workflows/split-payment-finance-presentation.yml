name: Split payment finance presentation

on:
  push:
    branches:
      - feature/split-payments

permissions:
  contents: read

concurrency:
  group: split-payment-finance-presentation
  cancel-in-progress: true

jobs:
  validate:
    name: validate finance receipt presentation
    runs-on: ubuntu-latest
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_PIN: ${{ secrets.STAGING_PIN }}
      STAGING_URL: https://sistema-para-delivery-staging.vzaponi.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused finance presentation tests
        run: >-
          node --test
          src/domains/finance/domain/movementPresentation.test.js
          src/domains/finance/ui/FinanceSplitPaymentPresentation.test.js
          src/pages/FinanceMoreMobile.test.js
          src/pages/DashboardAnalytics.test.js
          src/utils/dashboardAnalytics.test.js

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Deploy staging
        run: npm run deploy:staging

      - name: Verify staging
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.STAGING_URL
          let ready = false
          for (let attempt = 1; attempt <= 4; attempt += 1) {
            try {
              const response = await fetch(`${baseUrl}/api/auth/session`)
              if (response.ok) {
                console.log(`Staging ready on attempt ${attempt}/4`)
                ready = true
                break
              }
            } catch {}
            if (attempt < 4) await new Promise((resolve) => setTimeout(resolve, 3000))
          }
          if (!ready) process.exit(1)

          const login = await fetch(`${baseUrl}/api/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', origin: baseUrl },
            body: JSON.stringify({ pin: process.env.STAGING_PIN }),
          })
          if (!login.ok) process.exit(1)
          console.log(`Staging login HTTP ${login.status}`)
          NODE
