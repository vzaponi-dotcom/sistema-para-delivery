name: Kitchen Phase A Validation

on:
  push:
    branches:
      - codex/kitchen-redesign-homologation-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact homologated target
        uses: actions/checkout@v4
        with:
          ref: 52bf782ce6bc3eb54abee074b54f5e7463104b8f
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify exact target and base ancestry
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "52bf782ce6bc3eb54abee074b54f5e7463104b8f"
          git merge-base --is-ancestor b4e3427fecc7b9cc4403423546f10904a14b13a8 HEAD

      - name: Full test suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Patch integrity
        run: git diff --check b4e3427fecc7b9cc4403423546f10904a14b13a8...HEAD

      - name: Contract scans
        shell: bash
        run: |
          if grep -RInE --exclude='*.test.js' --exclude='*.test.jsx' "Aguardando janela|printed:[[:space:]]*['\"]Impresso['\"]|Este pedido já foi impresso\." src; then
            echo "Forbidden user-facing kitchen/printing copy found"
            exit 1
          fi
          if grep -RInE --exclude='*.test.js' --exclude='*.test.jsx' "order\.note|orderNote|generalNote" src shared worker migrations; then
            echo "Unexpected order-level note contract found"
            exit 1
          fi

      - name: Wrangler production-config dry run
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Wrangler staging-config dry run
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Local D1 migration compatibility
        shell: bash
        run: printf 'y\n' | npm run d1:migrate:local

      - name: Final patch integrity
        run: git diff --check b4e3427fecc7b9cc4403423546f10904a14b13a8...HEAD
