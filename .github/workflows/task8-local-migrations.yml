name: Task 8 local migration validation

on:
  push:
    branches:
      - feature/catalog-local-orders-round
    paths:
      - .github/workflows/task8-local-migrations.yml

permissions:
  contents: read

jobs:
  migrate-local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes wrangler@4.128.0 d1 migrations apply amor-e-sabor-delivery --local
