name: TDD production safety once

on:
  push:
    branches:
      - chore/production-safety-hardening
    paths:
      - scripts/infra/productionSafetyRegression.test.js
      - package.json
      - wrangler.jsonc
      - .github/workflows/validate.yml
      - .github/workflows/deploy-staging.yml
      - .github/workflows/deploy-production.yml
      - .github/pull_request_template.md
      - docs/release-and-migration-runbook.md
      - README.md
      - .github/workflows/tdd-production-safety-once.yml

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run production safety regression
        run: node --test scripts/infra/productionSafetyRegression.test.js
      - name: Run full test suite
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Apply migrations to local D1
        run: npm run d1:migrate:local
      - name: Validate production Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run
      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging
