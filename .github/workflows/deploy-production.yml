name: Deploy production

on:
  workflow_dispatch:
    inputs:
      backup_confirmed:
        description: Confirm the workflow-recorded production D1 restore point before publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_AUTH_PHASE: multi_company
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://app.mesiva.com.br' }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production multi-company configuration
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const vars = config.vars || {}
          if (vars.AUTH_EMAIL_ENABLED !== 'true') throw new Error('Production e-mail auth must stay enabled.')
          if (vars.AUTH_MULTI_COMPANY_ENABLED !== 'true') throw new Error('Production multi-company auth must stay enabled.')
          if (vars.AUTH_MULTI_COMPANY_PREPARE_ENABLED !== 'false') throw new Error('Production prepare mode must stay disabled.')
          if (vars.AUTH_PUBLIC_ORIGIN !== 'https://app.mesiva.com.br') throw new Error('Production AUTH_PUBLIC_ORIGIN is invalid.')
          if (vars.AUTH_EMAIL_FROM !== 'Mesiva <acesso@mesiva.com.br>') throw new Error('Production AUTH_EMAIL_FROM is invalid.')
          const dailyLimit = Number(vars.AUTH_EMAIL_DAILY_LIMIT)
          if (!Number.isSafeInteger(dailyLimit) || dailyLimit < 1) throw new Error('Production AUTH_EMAIL_DAILY_LIMIT is invalid.')
          NODE

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Require latest master commit
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "This master commit has been superseded; production publishing is blocked."
            exit 1
          fi

      - name: Record production D1 restore point
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx --yes wrangler@4.128.0 d1 time-travel info amor-e-sabor-delivery --json)"
          bookmark="$(RAW="$raw" node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.RAW || 'null')
          const findBookmark = current => {
            if (Array.isArray(current)) {
              for (const item of current) {
                const found = findBookmark(item)
                if (found) return found
              }
              return ''
            }
            if (!current || typeof current !== 'object') return ''
            if (typeof current.bookmark === 'string' && current.bookmark.trim()) return current.bookmark.trim()
            for (const item of Object.values(current)) {
              const found = findBookmark(item)
              if (found) return found
            }
            return ''
          }
          const bookmark = findBookmark(value)
          if (!bookmark || !/^[A-Za-z0-9_-]{16,}$/.test(bookmark)) throw new Error('Unable to resolve a current D1 Time Travel bookmark.')
          process.stdout.write(bookmark)
          NODE
          )"
          echo "PRODUCTION_D1_BOOKMARK=$bookmark" >> "$GITHUB_ENV"
          printf 'Production D1 restore bookmark recorded before publish: `%s`\n' "$bookmark" >> "$GITHUB_STEP_SUMMARY"

      - name: Require production safety checkpoint
        shell: bash
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
        run: |
          set -euo pipefail
          if [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "Production publish requires confirmation of the current D1 restore point."
            exit 1
          fi

      - name: Show pending D1 migrations
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery --remote

      - name: Apply D1 migrations
        run: npm run d1:migrate:production

      - name: Guard production authentication state
        shell: bash
        run: |
          set -euo pipefail
          raw="$(timeout 60s npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes --command "SELECT mode FROM business_auth_state WHERE business_id='amor-e-sabor' LIMIT 1;" --json)"
          current_mode="$(RAW="$raw" node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.RAW || 'null')
          const findMode = current => {
            if (Array.isArray(current)) {
              for (const item of current) {
                const found = findMode(item)
                if (found) return found
              }
              return ''
            }
            if (!current || typeof current !== 'object') return ''
            if (typeof current.mode === 'string') return current.mode
            for (const item of Object.values(current)) {
              const found = findMode(item)
              if (found) return found
            }
            return ''
          }
          const mode = findMode(value)
          if (!['legacy', 'user_only'].includes(mode)) throw new Error('Unexpected production auth state.')
          process.stdout.write(mode)
          NODE
          )"
          echo "Current production auth state: $current_mode"

      - name: Configure production e-mail secret
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is required for production multi-company login."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.128.0 secret put RESEND_API_KEY

      - name: Deploy
        run: npm run deploy:production

      - name: Verify production authentication phase
        run: node scripts/infra/production-auth-smoke.mjs

      - name: Summarize production release
        run: |
          echo "Production URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Published commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Authentication phase: multi_company" >> "$GITHUB_STEP_SUMMARY"
          echo "Production deploys are permanently multi-company; legacy PIN deployment is unavailable." >> "$GITHUB_STEP_SUMMARY"
