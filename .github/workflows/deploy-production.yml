name: Deploy production

on:
  workflow_dispatch:
    inputs:
      auth_phase:
        description: Production authentication phase
        required: true
        default: legacy
        type: choice
        options:
          - legacy
          - prepare
          - multi_company
      backup_confirmed:
        description: Confirm the workflow-recorded production D1 restore point before account-phase changes
        required: true
        default: false
        type: boolean
      readiness_confirmed:
        description: Confirm production admin/manager readiness before enabling multi-company login
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_AUTH_PHASE: ${{ inputs.auth_phase }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://app.mesiva.com.br' }}
      PRODUCTION_AUTH_PUBLIC_ORIGIN: ${{ vars.AUTH_PUBLIC_ORIGIN }}
      PRODUCTION_AUTH_EMAIL_FROM: ${{ vars.AUTH_EMAIL_FROM }}
      PRODUCTION_AUTH_EMAIL_DAILY_LIMIT: ${{ vars.AUTH_EMAIL_DAILY_LIMIT || '80' }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Validate frontend architecture
        run: npm run test:architecture

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Configure production authentication phase
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const phase = process.env.PRODUCTION_AUTH_PHASE
          if (!['legacy', 'prepare', 'multi_company'].includes(phase)) throw new Error('Invalid production auth phase.')

          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const vars = config.vars ||= {}
          vars.AUTH_EMAIL_ENABLED = phase === 'multi_company' ? 'true' : 'false'
          vars.AUTH_MULTI_COMPANY_ENABLED = phase === 'multi_company' ? 'true' : 'false'
          vars.AUTH_MULTI_COMPANY_PREPARE_ENABLED = phase === 'prepare' ? 'true' : 'false'

          if (phase !== 'legacy') {
            const origin = process.env.PRODUCTION_AUTH_PUBLIC_ORIGIN || ''
            const from = process.env.PRODUCTION_AUTH_EMAIL_FROM || ''
            const dailyLimit = Number(process.env.PRODUCTION_AUTH_EMAIL_DAILY_LIMIT || '80')
            const url = new URL(origin)
            if (url.protocol !== 'https:' || url.origin !== origin || url.username || url.password) throw new Error('Production AUTH_PUBLIC_ORIGIN must be a trusted HTTPS origin.')
            if (!from.trim()) throw new Error('Production AUTH_EMAIL_FROM is required for prepare/multi_company.')
            if (!Number.isSafeInteger(dailyLimit) || dailyLimit < 1) throw new Error('Production AUTH_EMAIL_DAILY_LIMIT is invalid.')
            vars.AUTH_PUBLIC_ORIGIN = origin
            vars.AUTH_EMAIL_FROM = from
            vars.AUTH_EMAIL_DAILY_LIMIT = String(dailyLimit)
          }

          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n')
          console.log(`Prepared production auth phase: ${phase}`)
          NODE

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Require latest master commit
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git ls-remote origin refs/heads/master | cut -f1)"
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "This master commit has been superseded; production publishing is blocked."
            exit 1
          fi

      - name: Record production D1 restore point
        if: inputs.auth_phase != 'legacy'
        shell: bash
        run: |
          set -euo pipefail
          raw="$(npx --yes wrangler@4.128.0 d1 time-travel info amor-e-sabor-delivery --json)"
          bookmark="$(RAW="$raw" node --input-type=module <<'NODE'
          const value = JSON.parse(process.env.RAW || 'null')
          const findBookmark = current => {
            if (Array.isArray(current)) {
              for (const item of current) {
                const found = findBookmark(item)
                if (found) return found
              }
              return ''
            }
            if (!current || typeof current !== 'object') return ''
            if (typeof current.bookmark === 'string' && current.bookmark.trim()) return current.bookmark.trim()
            for (const item of Object.values(current)) {
              const found = findBookmark(item)
              if (found) return found
            }
            return ''
          }
          const bookmark = findBookmark(value)
          if (!bookmark || !/^[A-Za-z0-9_-]{16,}$/.test(bookmark)) throw new Error('Unable to resolve a current D1 Time Travel bookmark.')
          process.stdout.write(bookmark)
          NODE
          )"
          echo "PRODUCTION_D1_BOOKMARK=$bookmark" >> "$GITHUB_ENV"
          printf 'Production D1 restore bookmark recorded before account-phase changes: `%s`\n' "$bookmark" >> "$GITHUB_STEP_SUMMARY"

      - name: Require cutover checkpoints
        shell: bash
        env:
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          READINESS_CONFIRMED: ${{ inputs.readiness_confirmed }}
        run: |
          set -euo pipefail
          if [ "$PRODUCTION_AUTH_PHASE" != "legacy" ] && [ "$BACKUP_CONFIRMED" != "true" ]; then
            echo "prepare/multi_company requires a confirmed current production D1 restore point."
            exit 1
          fi
          if [ "$PRODUCTION_AUTH_PHASE" = "multi_company" ] && [ "$READINESS_CONFIRMED" != "true" ]; then
            echo "multi_company requires an explicit successful production readiness check."
            exit 1
          fi

      - name: Show pending D1 migrations
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery --remote

      - name: Apply D1 migrations
        run: npm run d1:migrate:production

      - name: Guard requested phase against current production auth state
        shell: bash
        run: |
          set -euo pipefail
          current_mode="$(node --input-type=module <<'NODE'
          import { connectInfrastructure } from './scripts/infra/issue-44-access-admin.mjs'
          process.env.WRANGLER_LOG = 'error'
          process.env.WRANGLER_SEND_METRICS = 'false'
          process.env.CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV = 'false'
          const connection = await connectInfrastructure('production')
          try {
            const row = await connection.db.prepare("SELECT mode FROM business_auth_state WHERE business_id='amor-e-sabor' LIMIT 1").first()
            const mode = row?.mode || ''
            if (!['legacy', 'enrollment', 'user_only'].includes(mode)) throw new Error('Unable to resolve production auth state.')
            process.stdout.write(mode)
          } finally {
            await connection.dispose()
          }
          NODE
          )"
          echo "Current production auth state: $current_mode"
          if [ "$current_mode" = "user_only" ] && [ "$PRODUCTION_AUTH_PHASE" != "multi_company" ]; then
            echo "Production is already user_only; legacy/prepare deployment is blocked."
            exit 1
          fi

      - name: Configure production PIN only in legacy phase
        if: inputs.auth_phase == 'legacy'
        shell: bash
        env:
          AMOR_PIN: ${{ secrets.AMOR_PIN }}
        run: |
          if [ -z "$AMOR_PIN" ]; then
            echo "AMOR_PIN is not configured; keeping the current production PIN verifier."
            exit 0
          fi

          VERIFIER="$(PIN="$AMOR_PIN" node scripts/generate-pin-hash.mjs)"
          echo "::add-mask::$VERIFIER"

          VERIFIER="$VERIFIER" node --input-type=module <<'NODE'
          import fs from 'node:fs'

          const verifier = process.env.VERIFIER
          if (!verifier) throw new Error('PIN verifier was not generated.')

          const escapedVerifier = verifier.replaceAll("'", "''")
          const sql = `INSERT INTO auth_credentials (business_id, pin_hash, created_at, updated_at)
          VALUES ('amor-e-sabor', '${escapedVerifier}', datetime('now'), datetime('now'))
          ON CONFLICT(business_id) DO UPDATE SET
            pin_hash = excluded.pin_hash,
            updated_at = datetime('now');\n`

          fs.writeFileSync('/tmp/amor-pin.sql', sql, { mode: 0o600 })
          NODE

          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes --file /tmp/amor-pin.sql
          rm -f /tmp/amor-pin.sql
          unset VERIFIER

      - name: Configure production e-mail secret for account phases
        if: inputs.auth_phase != 'legacy'
        shell: bash
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY is required for prepare/multi_company."
            exit 1
          fi
          printf '%s' "$RESEND_API_KEY" | npx --yes wrangler@4.128.0 secret put RESEND_API_KEY

      - name: Deploy
        run: npm run deploy:production

      - name: Verify production authentication phase
        env:
          AMOR_PIN: ${{ secrets.AMOR_PIN }}
        run: node scripts/infra/production-auth-smoke.mjs

      - name: Summarize production release
        run: |
          echo "Production URL: $PRODUCTION_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Published commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Authentication phase: $PRODUCTION_AUTH_PHASE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$PRODUCTION_AUTH_PHASE" = "prepare" ]; then
            echo "Legacy PIN remains authoritative; only account activation/invitation preparation endpoints are enabled." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PRODUCTION_AUTH_PHASE" = "multi_company" ]; then
            echo "Multi-company login is enabled. Do not finalize legacy access until real administrator and manager logins are manually verified." >> "$GITHUB_STEP_SUMMARY"
          fi
