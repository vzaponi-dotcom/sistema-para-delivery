name: Verify scheduled printing block 2

on:
  push:
    branches:
      - feature/scheduled-cancel-immediate-printing

permissions:
  contents: write

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'chore: verify scheduled printing block 2' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/scheduled-cancel-immediate-printing
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate production Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Validate staging Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run --env staging

      - name: Apply migrations to local D1
        run: npm run d1:migrate:local

      - name: Remove temporary verifier
        run: |
          rm .github/workflows/_verify-scheduled-block2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/_verify-scheduled-block2.yml
          git commit -m "chore: remove scheduled verification workflow"
          git push origin HEAD:feature/scheduled-cancel-immediate-printing
