name: Patch table tabs task 2 tests

on:
  push:
    branches:
      - feature/table-tabs-round
    paths:
      - .github/workflows/patch-table-tabs-task2-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/table-tabs-round
      - name: Align exact legacy test contracts
        run: |
          python - <<'PY'
          from pathlib import Path

          files = {
            'worker/index.test.js': [
              (
                "    orders: [],\n    movements: [],",
                "    orders: [],\n    tableTabs: [],\n    movements: [],",
              ),
            ],
            'worker/orderRepositories.test.js': [
              (
                "const [id, businessId, clientId, clientName, customerIdentityType, type, orderDate, status, subtotal, deliveryFee, adjustmentType, adjustmentMode, adjustmentValue, adjustmentAmount, adjustmentReason, total, createdAt, finishedAt, idempotencyKey] = values",
                "const [id, businessId, clientId, clientName, customerIdentityType, tableTabId, type, orderDate, status, subtotal, deliveryFee, adjustmentType, adjustmentMode, adjustmentValue, adjustmentAmount, adjustmentReason, total, createdAt, finishedAt, idempotencyKey] = values",
              ),
              (
                "customer_identity_type: customerIdentityType, type, order_date: orderDate",
                "customer_identity_type: customerIdentityType, table_tab_id: tableTabId, type, order_date: orderDate",
              ),
            ],
          }

          for filename, replacements in files.items():
            path = Path(filename)
            source = path.read_text()
            for old, new in replacements:
              count = source.count(old)
              if count != 1:
                raise SystemExit(f'{filename}: expected exactly one match, found {count}: {old[:100]}')
              source = source.replace(old, new, 1)
            path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/index.test.js worker/orderRepositories.test.js
          git commit -m "test: align table tabs repository contracts"
          git push origin HEAD:feature/table-tabs-round
