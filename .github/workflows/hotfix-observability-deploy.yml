name: Deploy bootstrap observability hotfix

on:
  push:
    branches:
      - hotfix/bootstrap-observability

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy diagnostic hotfix without D1 migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_URL: https://sistema-para-delivery.vzaponi.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Deploy hotfix only
        run: npm run deploy

      - name: Verify production root
        shell: bash
        run: |
          status="$(curl -sS -o /tmp/production-root.html -w '%{http_code}' "$PRODUCTION_URL/")"
          echo "Production root HTTP $status"
          test "$status" = "200"

      - name: Probe bootstrap and capture Worker diagnostics
        shell: bash
        env:
          AMOR_PIN: ${{ secrets.AMOR_PIN }}
        run: |
          if [ -z "$AMOR_PIN" ]; then
            echo "AMOR_PIN is not configured; skipping authenticated bootstrap probe."
            exit 0
          fi

          rm -f /tmp/worker-tail.log
          (timeout 35s npx --yes wrangler@4.128.0 tail sistema-para-delivery --format=json --ip self > /tmp/worker-tail.log 2>&1 || true) &
          tail_pid=$!
          sleep 7

          set +e
          node --input-type=module <<'NODE'
          const baseUrl = process.env.PRODUCTION_URL
          const pin = process.env.AMOR_PIN

          const login = await fetch(`${baseUrl}/api/auth/login`, {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              origin: baseUrl,
            },
            body: JSON.stringify({ pin }),
          })

          const loginText = await login.text()
          let loginPayload = null
          try { loginPayload = JSON.parse(loginText) } catch {}
          const loginCode = loginPayload?.error?.code ? ` (${loginPayload.error.code})` : ''
          console.log(`Production login HTTP ${login.status}${loginCode}`)
          if (!login.ok) process.exit(2)

          const setCookie = login.headers.get('set-cookie') || ''
          const cookie = setCookie.split(';')[0]
          if (!cookie.includes('=')) {
            console.error('Production login did not return a session cookie.')
            process.exit(2)
          }

          const bootstrap = await fetch(`${baseUrl}/api/bootstrap`, {
            headers: { cookie },
          })
          const bootstrapText = await bootstrap.text()
          let bootstrapPayload = null
          try { bootstrapPayload = JSON.parse(bootstrapText) } catch {}
          const bootstrapCode = bootstrapPayload?.error?.code ? ` (${bootstrapPayload.error.code})` : ''
          console.log(`Production bootstrap HTTP ${bootstrap.status}${bootstrapCode}`)
          console.log(`Production bootstrap body: ${bootstrapText.slice(0, 1000)}`)

          if (bootstrap.status >= 500) process.exit(3)
          if (!bootstrap.ok) process.exit(4)
          NODE
          probe_status=$?
          set -e

          sleep 7
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true

          echo "=== Captured Worker tail ==="
          cat /tmp/worker-tail.log || true

          if [ "$probe_status" -eq 2 ]; then
            echo "Authenticated login probe failed."
            exit 2
          fi
          if [ "$probe_status" -eq 4 ]; then
            echo "Bootstrap returned a non-500 error."
            exit 4
          fi
          if [ "$probe_status" -eq 3 ]; then
            echo "Bootstrap server error reproduced; Worker diagnostics were captured above."
            exit 0
          fi

          echo "Authenticated bootstrap probe succeeded."
