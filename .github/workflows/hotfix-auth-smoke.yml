name: Production authenticated smoke test

on:
  push:
    branches:
      - hotfix/bootstrap-observability
    paths:
      - .github/workflows/hotfix-auth-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    name: Login and bootstrap smoke test
    runs-on: ubuntu-latest
    env:
      APP_URL: https://sistema-para-delivery.vzaponi.workers.dev
      AMOR_PIN: ${{ secrets.AMOR_PIN }}

    steps:
      - name: Check smoke-test secret
        shell: bash
        run: |
          if [ -z "$AMOR_PIN" ]; then
            echo "AMOR_PIN is not configured."
            exit 1
          fi

      - name: Verify login session and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          cookie_jar="$(mktemp)"
          login_body="$(mktemp)"
          session_body="$(mktemp)"
          bootstrap_body="$(mktemp)"
          trap 'rm -f "$cookie_jar" "$login_body" "$session_body" "$bootstrap_body"' EXIT

          payload="$(jq -nc --arg pin "$AMOR_PIN" '{pin:$pin}')"

          login_status="$(curl -sS -o "$login_body" -w '%{http_code}' \
            -c "$cookie_jar" \
            -H "Origin: $APP_URL" \
            -H 'Content-Type: application/json' \
            --data "$payload" \
            "$APP_URL/api/auth/login")"
          echo "login HTTP $login_status"
          test "$login_status" = "200"
          jq -e '.authenticated == true and .businessId == "amor-e-sabor"' "$login_body" >/dev/null

          session_status="$(curl -sS -o "$session_body" -w '%{http_code}' \
            -b "$cookie_jar" \
            "$APP_URL/api/auth/session")"
          echo "session HTTP $session_status"
          test "$session_status" = "200"
          jq -e '.authenticated == true and .businessId == "amor-e-sabor"' "$session_body" >/dev/null

          bootstrap_status="$(curl -sS -o "$bootstrap_body" -w '%{http_code}' \
            -b "$cookie_jar" \
            "$APP_URL/api/bootstrap")"
          echo "bootstrap HTTP $bootstrap_status"
          if [ "$bootstrap_status" != "200" ]; then
            jq . "$bootstrap_body" || cat "$bootstrap_body"
            exit 1
          fi

          jq -e '
            .business.id == "amor-e-sabor"
            and (.clients | type == "array")
            and (.products | type == "array")
            and (.orders | type == "array")
            and (.tableTabs | type == "array")
            and (.movements | type == "array")
          ' "$bootstrap_body" >/dev/null

          jq '{
            business: .business.id,
            clients: (.clients | length),
            products: (.products | length),
            orders: (.orders | length),
            tableTabs: (.tableTabs | length),
            movements: (.movements | length)
          }' "$bootstrap_body"
