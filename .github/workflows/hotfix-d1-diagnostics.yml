name: Inspect production D1 for bootstrap diagnostics

on:
  push:
    branches:
      - hotfix/bootstrap-observability

permissions:
  contents: read

jobs:
  inspect:
    name: Read-only D1 diagnostics
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: List pending D1 migrations
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery --remote

      - name: List production D1 tables
        run: >-
          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes
          --command "SELECT type, name FROM sqlite_master WHERE type IN ('table','index') ORDER BY type, name;"

      - name: Inspect bootstrap-critical columns
        shell: bash
        run: |
          for table in businesses clients products orders order_items payments financial_movements sessions auth_credentials table_tabs; do
            echo "=== PRAGMA table_info($table) ==="
            npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes --command "PRAGMA table_info($table);" || true
          done
