name: Verify clean table tabs tree

on:
  push:
    branches:
      - feature/table-tabs-round
    paths:
      - .github/workflows/verify-clean-table-tabs.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a132f8decff359e499b8a7975f02a85a2c2d23a8
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Validate Worker bundle
        run: npx --yes wrangler@4.128.0 deploy --dry-run
