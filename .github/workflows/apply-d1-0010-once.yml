name: Apply D1 migration 0010 once

on:
  push:
    branches:
      - ops/apply-d1-0010
    paths:
      - .github/workflows/apply-d1-0010-once.yml

permissions:
  contents: read

jobs:
  migrate:
    name: Apply pending D1 migrations
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare credentials are not configured."
            exit 1
          fi

      - name: Show pending D1 migrations before apply
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery --remote

      - name: Apply pending D1 migrations
        run: npm run d1:migrate:remote

      - name: Confirm no pending migrations remain
        run: npx --yes wrangler@4.128.0 d1 migrations list amor-e-sabor-delivery --remote

      - name: Verify printing tables
        run: >-
          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes
          --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name IN ('print_jobs', 'print_stations') ORDER BY name;"

      - name: Verify order contact snapshot columns
        run: >-
          npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --remote --yes
          --command "SELECT name FROM pragma_table_info('orders') WHERE name IN ('client_address_snapshot', 'client_phone_snapshot') ORDER BY name;"
