name: Validate table tabs local migrations

on:
  push:
    branches:
      - feature/table-tabs-round
    paths:
      - .github/workflows/validate-table-tabs-local-migrations.yml

jobs:
  validate-local-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply all D1 migrations locally
        run: npx --yes wrangler@4.128.0 d1 migrations apply amor-e-sabor-delivery --local
      - name: Verify table tabs schema locally
        run: |
          set -euo pipefail
          TABLE_OUTPUT="$(npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --local --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name = 'table_tabs';")"
          INDEX_OUTPUT="$(npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --local --command "SELECT name FROM sqlite_master WHERE type = 'index' AND name = 'idx_table_tabs_one_open_per_table';")"
          ORDERS_OUTPUT="$(npx --yes wrangler@4.128.0 d1 execute amor-e-sabor-delivery --local --command "PRAGMA table_info(orders);")"
          printf '%s\n' "$TABLE_OUTPUT"
          printf '%s\n' "$INDEX_OUTPUT"
          printf '%s\n' "$ORDERS_OUTPUT"
          grep -q 'table_tabs' <<< "$TABLE_OUTPUT"
          grep -q 'idx_table_tabs_one_open_per_table' <<< "$INDEX_OUTPUT"
          grep -q 'table_tab_id' <<< "$ORDERS_OUTPUT"
