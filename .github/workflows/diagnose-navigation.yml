name: Diagnose navigation continuity

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  navigation-continuity:
    name: navigation-continuity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Instrument diagnostic test
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/navigationContinuity.test.js")
          text = path.read_text()
          replacements = [
              ("  const renderer = await h.render(App, {}, {", "  console.error('NAVDBG before-render')\n  const renderer = await h.render(App, {}, {"),
              ("  const baseline = h.activitySnapshot({ ignoreFocus: true })", "  console.error('NAVDBG render-done')\n  const baseline = h.activitySnapshot({ ignoreFocus: true })"),
              ("  const focusAfterNavigation = h.activitySnapshot().focus", "  console.error('NAVDBG cycles-done')\n  const focusAfterNavigation = h.activitySnapshot().focus"),
              ("  await navigate(h, 'settings-printing')\n  const copySelector", "  console.error('NAVDBG visibility-done')\n  await navigate(h, 'settings-printing')\n  console.error('NAVDBG settings-route-done')\n  const copySelector"),
              ("  await act(async () => copySelector.props.onClick())", "  console.error('NAVDBG before-selector-open')\n  await act(async () => copySelector.props.onClick())\n  console.error('NAVDBG selector-opened')"),
              ("  const secondCopy = renderer.root.findAllByProps({ role: 'option' }).find((option) => nodeText(option) === '2 vias')", "  const secondCopy = renderer.root.findAllByProps({ role: 'option' }).find((option) => nodeText(option) === '2 vias')\n  console.error('NAVDBG option-found', Boolean(secondCopy))"),
              ("  await act(async () => { secondCopy.props.onClick() })", "  console.error('NAVDBG before-option-click')\n  await act(async () => { secondCopy.props.onClick() })\n  console.error('NAVDBG option-clicked')"),
              ("  await act(async () => {\n    void buttonNamed(renderer.root, 'Salvar política').props.onClick()\n    await state.settingsStarted.promise\n  })", "  console.error('NAVDBG before-save-click')\n  await act(async () => {\n    void buttonNamed(renderer.root, 'Salvar política').props.onClick()\n    console.error('NAVDBG save-clicked-awaiting-put')\n    await state.settingsStarted.promise\n    console.error('NAVDBG put-started')\n  })\n  console.error('NAVDBG save-act-done')"),
              ("  await navigate(h, 'clients')\n  state.copies = 2; state.revision = 2", "  console.error('NAVDBG writes-asserted')\n  await navigate(h, 'clients')\n  state.copies = 2; state.revision = 2"),
              ("  await navigate(h, 'settings-printing')\n  assert.equal(state.settingsWrites, 1", "  console.error('NAVDBG save-resolved')\n  await navigate(h, 'settings-printing')\n  console.error('NAVDBG returned-settings')\n  assert.equal(state.settingsWrites, 1"),
              ("  await navigate(h, 'orders')\n  const search", "  console.error('NAVDBG settings-asserted')\n  await navigate(h, 'orders')\n  const search"),
              ("  assert.equal(renderer.root.findByProps({ placeholder: 'Buscar cliente, pedido, produto ou tipo' }).props.value, 'maria', 'internal navigation must preserve approved query context')", "  assert.equal(renderer.root.findByProps({ placeholder: 'Buscar cliente, pedido, produto ou tipo' }).props.value, 'maria', 'internal navigation must preserve approved query context')\n  console.error('NAVDBG test-end')")
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"missing diagnostic anchor: {old[:80]}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Run navigation continuity test
        run: timeout --signal=TERM --kill-after=5s 45s node --test src/navigationContinuity.test.js
