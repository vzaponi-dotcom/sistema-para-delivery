name: Generate QZ lockfile once

on:
  push:
    branches:
      - feature/android-rawbt-printing
    paths:
      - .github/workflows/qz-lockfile-once.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.ref == 'refs/heads/feature/android-rawbt-printing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/android-rawbt-printing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact qz-tray@2.2.6
      - name: Commit dependency files
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin QZ Tray 2.2.6"
          git push origin HEAD:feature/android-rawbt-printing
