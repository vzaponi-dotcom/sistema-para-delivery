name: Patch table tabs task 5

on:
  push:
    branches:
      - feature/table-tabs-round
    paths:
      - .github/workflows/patch-table-tabs-task5.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/table-tabs-round
      - name: Apply exact app wiring patch
        run: python .github/patch-table-tabs-task5.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api/client.js src/App.jsx
          git commit -m "feat: wire table tabs into app state"
          git push origin HEAD:feature/table-tabs-round
