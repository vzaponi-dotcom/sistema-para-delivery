name: TDD order printing

on:
  push:
    branches:
      - feature/order-printing-escpos

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run focused printing test
        run: node --test worker/orderPrintingMigration.test.js

      - name: Validate local D1 migrations
        run: npm run d1:migrate:local
