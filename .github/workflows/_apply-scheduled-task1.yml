name: Apply scheduled printing patch safely

on:
  push:
    branches:
      - feature/scheduled-cancel-immediate-printing

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply scheduled printing patch safely'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scheduled-cancel-immediate-printing
          fetch-depth: 0

      - name: Apply exact Task 1 patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('worker/repositories.js')
          source = path.read_text()
          old_import = "import { getOperationalStartAt } from '../shared/orderTiming.js'\n"
          old_available = "availableAt: getOperationalStartAt({ createdAt, scheduledFor })?.toISOString() || createdAt,"
          new_available = "availableAt: createdAt,"
          if source.count(old_import) != 1:
              raise SystemExit(f'expected exactly one timing import, found {source.count(old_import)}')
          if source.count(old_available) != 1:
              raise SystemExit(f'expected exactly one availability expression, found {source.count(old_available)}')
          source = source.replace(old_import, '')
          source = source.replace(old_available, new_available)
          path.write_text(source)
          PY
          rm .github/workflows/_apply-scheduled-task1.yml .github/_scheduled-task1-trigger

      - name: Commit scoped implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/repositories.js .github/workflows/_apply-scheduled-task1.yml .github/_scheduled-task1-trigger
          git commit -m "feat: print new scheduled orders immediately"
          git push origin HEAD:feature/scheduled-cancel-immediate-printing
