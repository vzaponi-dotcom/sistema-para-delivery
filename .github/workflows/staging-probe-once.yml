name: Staging probe once

on:
  push:
    branches:
      - chore/production-safety-hardening
    paths:
      - .github/workflows/staging-probe-once.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: staging
    env:
      STAGING_PIN: ${{ secrets.STAGING_PIN }}
      STAGING_URL: https://sistema-para-delivery-staging.vzaponi.workers.dev
    steps:
      - name: Probe deployed staging endpoints
        run: |
          node --input-type=module <<'NODE'
          const baseUrl = process.env.STAGING_URL
          const probes = [
            { label: 'root', url: `${baseUrl}/`, init: {} },
            { label: 'session', url: `${baseUrl}/api/auth/session`, init: {} },
            {
              label: 'login',
              url: `${baseUrl}/api/auth/login`,
              init: {
                method: 'POST',
                headers: { 'content-type': 'application/json', origin: baseUrl },
                body: JSON.stringify({ pin: process.env.STAGING_PIN }),
              },
            },
          ]

          let failed = false
          for (const probe of probes) {
            const response = await fetch(probe.url, probe.init)
            const body = (await response.text()).slice(0, 300).replaceAll('\n', ' ')
            console.log(`${probe.label}: HTTP ${response.status}; content-type=${response.headers.get('content-type') || 'none'}; body=${body}`)
            if (probe.label === 'root' && response.status !== 200) failed = true
            if (probe.label === 'session' && response.status !== 200) failed = true
            if (probe.label === 'login' && !response.ok) failed = true
          }
          if (failed) process.exit(1)
          NODE
