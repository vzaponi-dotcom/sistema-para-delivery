name: TDD kitchen light contrast

on:
  push:
    branches:
      - codex/kitchen-redesign-homologation-20260904

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused theme tests
        run: node --test src/theme.test.js

      - name: Run full test suite
        run: npm test

      - name: Lint application
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Check diff whitespace
        run: git diff --check HEAD^ HEAD
