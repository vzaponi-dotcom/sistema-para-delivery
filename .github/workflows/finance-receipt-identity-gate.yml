name: Finance receipt identity gate

on:
  push:
    branches:
      - feature/split-payments

permissions:
  contents: read

jobs:
  validate:
    name: validate finance receipt identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Focused tests
        run: >-
          node --test
          worker/repositories.test.js
          worker/financeRepository.test.js
          src/domains/finance/domain/movementPresentation.test.js
          src/domains/finance/ui/FinanceSplitPaymentPresentation.test.js
          src/pages/FinanceMoreMobile.test.js
          src/c10CssOwnership.test.js
      - name: Validate frontend architecture
        run: npm run test:architecture
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
